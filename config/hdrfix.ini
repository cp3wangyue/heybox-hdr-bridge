# HEYBOX HDR Bridge configuration
# Values marked Auto/System are resolved at runtime when supported.

[General]
Enable=true
FailOpen=true
Input=Auto
Output=Rec709
DebugOverlay=false
LogLevel=info

[HDR]
ToneMapper=Auto
SourcePeakNits=Auto
SDRReferenceWhite=System
Exposure=0.0
HighlightRollOff=1.0

[Compatibility]
# NOTE: the current runtime guard only performs a coarse host-process check.
# Full client/module version + hash validation is not implemented yet.
StrictVersionCheck=true
AllowUnknownBuild=false
