# HEYBOX HDR Bridge configuration
# Values marked Auto/System are resolved at runtime when supported.

[General]
Enable=true
FailOpen=true
Input=Auto
# Output 色彩空间与 OETF：sRGB（默认，对齐 OBS Studio 28+，暗部扎实色彩通透）、Rec709、Gamma24、Linear
Output=sRGB
DebugOverlay=false
LogLevel=info

[HDR]
# ToneMapper 色调映射算子：
# Auto / BT2390: ITU-R BT.2390 EETF 国际广播标准（对标 OBS Studio 28+ MaxRGB 算法，推荐默认）
# OBSReinhard: OBS 风格 Rec.2020 宽色域 Reinhard
# Reinhard / Hable / ACES / LumaHuePreserve / Clamp
ToneMapper=BT2390
SourcePeakNits=Auto
SDRReferenceWhite=System
Exposure=0.0
HighlightRollOff=1.0

[Compatibility]
# 四级版本兼容体系策略：
# Verified: compat.json 官方验证版本，完全信任
# UntestedCompatible: 未知/更新版本，但在运行时通过能力检测 (WGC/RTC/PixelFormat/FP16)
# Incompatible / DiagnoseOnly: 关键接口缺失或结构异常，强制 Fail-open 原生透传
#
# AllowUntestedCompatible: 允许能力检测通过的未知版本自动启用 HDR 修复 (默认 true)
AllowUntestedCompatible=true
StrictVersionCheck=false
AllowUnknownBuild=true
