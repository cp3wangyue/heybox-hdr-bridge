# hdrfix.ini — 配置样例（计划书 §10.2）
# 发布级别说明见 §12.3：Dev 全日志 / Alpha 限版本 / Beta 日志限流 / Release 最少 UI

[General]
Enable=true
FailOpen=true
Input=Auto
Output=Rec709
DebugOverlay=false
LogLevel=info

[HDR]
ToneMapper=Auto
SourcePeakNits=Auto
SDRReferenceWhite=System
Exposure=0.0
HighlightRollOff=1.0

[Compatibility]
StrictVersionCheck=true
AllowUnknownBuild=false
